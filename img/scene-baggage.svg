<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132033"/>
      <stop offset="1" stop-color="#090e16"/>
    </linearGradient>
    <linearGradient id="bbeltTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e4a66"/>
      <stop offset="1" stop-color="#223b54"/>
    </linearGradient>
    <linearGradient id="bbeltFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16283a"/>
      <stop offset="1" stop-color="#0c1622"/>
    </linearGradient>
    <radialGradient id="blamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f0b429" stop-opacity=".42"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bwarm" cx=".5" cy=".3" r=".62">
      <stop offset="0" stop-color="#f7c548" stop-opacity=".14"/>
      <stop offset="1" stop-color="#f7c548" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bvig" cx=".5" cy=".45" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="caseBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b303b"/>
      <stop offset="1" stop-color="#171b23"/>
    </linearGradient>
    <linearGradient id="caseBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35618f"/>
      <stop offset="1" stop-color="#22405f"/>
    </linearGradient>
    <linearGradient id="caseRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b3542"/>
      <stop offset="1" stop-color="#5d2230"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bwall)"/>
  <rect width="900" height="92" fill="#0d1521"/>

  <!-- 顶灯 -->
  <ellipse cx="210" cy="50" rx="150" ry="50" fill="url(#blamp)"/>
  <ellipse cx="470" cy="50" rx="160" ry="52" fill="url(#blamp)"/>
  <ellipse cx="720" cy="50" rx="150" ry="50" fill="url(#blamp)"/>
  <rect x="150" y="45" width="120" height="10" rx="5" fill="#f0b429" opacity=".9"/>
  <rect x="410" y="45" width="120" height="10" rx="5" fill="#f0b429" opacity=".9"/>
  <rect x="670" y="45" width="120" height="10" rx="5" fill="#f0b429" opacity=".9"/>

  <!-- 后墙 -->
  <g stroke="#1c2a3d" stroke-width="2" opacity=".85">
    <line x1="120" y1="92" x2="120" y2="356"/>
    <line x1="300" y1="92" x2="300" y2="356"/>
    <line x1="600" y1="92" x2="600" y2="356"/>
    <line x1="780" y1="92" x2="780" y2="356"/>
  </g>
  <rect x="40" y="120" width="150" height="230" rx="6" fill="#0b111a" stroke="#22314a" stroke-width="2"/>
  <rect x="712" y="120" width="150" height="230" rx="6" fill="#0b111a" stroke="#22314a" stroke-width="2"/>

  <!-- 工作人员 -->
  <g>
    <path d="M96 372 L100 286 Q106 258 138 252 L206 252 Q238 258 244 286 L248 372 Z" fill="#28455f"/>
    <path d="M96 372 L100 286 Q106 258 138 252 L172 252 L172 372 Z" fill="#31536f"/>
    <path d="M150 254 L172 286 L194 254 L184 250 L172 268 L160 250 Z" fill="#dfe7f0" opacity=".85"/>
    <rect x="120" y="298" width="46" height="11" rx="4" fill="#f0b429" opacity=".75"/>
    <!-- 脖子 -->
    <rect x="154" y="228" width="36" height="34" rx="13" fill="#c99a72"/>
    <!-- 头 -->
    <ellipse cx="172" cy="196" rx="42" ry="47" fill="#d9ab80"/>
    <ellipse cx="130" cy="198" rx="8" ry="12" fill="#c99a72"/>
    <ellipse cx="214" cy="198" rx="8" ry="12" fill="#c99a72"/>
    <!-- 头发 -->
    <path d="M132 180 Q140 150 172 148 Q204 150 212 180 Q202 166 172 166 Q142 166 132 180 Z" fill="#1b2330"/>
    <path d="M132 186 Q136 168 144 162 L146 182 Q138 186 134 196 Z" fill="#1b2330"/>
    <path d="M212 186 Q208 168 200 162 L198 182 Q206 186 210 196 Z" fill="#1b2330"/>
    <!-- 五官 -->
    <ellipse cx="157" cy="198" rx="4" ry="4.6" fill="#121820"/>
    <ellipse cx="187" cy="198" rx="4" ry="4.6" fill="#121820"/>
    <path d="M172 202 L172 214 Q172 218 168 218" stroke="#b98a63" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M161 226 Q172 230 183 226" stroke="#a9714f" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <!-- 手里的登记板 -->
    <rect x="212" y="300" width="62" height="80" rx="5" fill="#131b26" stroke="#3a4f69" stroke-width="2" transform="rotate(8 243 340)"/>
    <rect x="220" y="314" width="44" height="4" rx="2" fill="#3d5570" transform="rotate(8 243 340)"/>
    <rect x="220" y="324" width="36" height="4" rx="2" fill="#33475e" transform="rotate(8 243 340)"/>
  </g>

  <!-- 传送带 -->
  <polygon points="30,352 870,352 900,384 0,384" fill="url(#bbeltTop)"/>
  <rect x="0" y="384" width="900" height="76" fill="url(#bbeltFace)"/>
  <line x1="30" y1="352" x2="0" y2="384" stroke="#6a8cae" stroke-width="3" opacity=".5"/>
  <line x1="870" y1="352" x2="900" y2="384" stroke="#6a8cae" stroke-width="3" opacity=".5"/>
  <rect x="0" y="382" width="900" height="4" fill="#f0b429" opacity=".22"/>
  <g fill="#101d2b" stroke="#2c425a" stroke-width="2">
    <circle cx="70" cy="422" r="13"/>
    <circle cx="180" cy="422" r="13"/>
    <circle cx="290" cy="422" r="13"/>
    <circle cx="400" cy="422" r="13"/>
    <circle cx="510" cy="422" r="13"/>
    <circle cx="620" cy="422" r="13"/>
    <circle cx="730" cy="422" r="13"/>
    <circle cx="840" cy="422" r="13"/>
  </g>
  <rect x="0" y="446" width="900" height="8" fill="#0a1119" opacity=".8"/>

  <!-- 箱子：黑色大箱 -->
  <g>
    <rect x="330" y="236" width="116" height="150" rx="12" fill="url(#caseBlack)"/>
    <rect x="346" y="252" width="84" height="8" rx="4" fill="#3b4250"/>
    <rect x="376" y="214" width="24" height="26" rx="7" fill="none" stroke="#4a525f" stroke-width="6"/>
    <rect x="330" y="318" width="116" height="6" fill="#404857" opacity=".7"/>
    <!-- 行李牌 -->
    <rect x="352" y="268" width="26" height="40" rx="4" fill="#c9a86a" opacity=".9"/>
    <circle cx="365" cy="276" r="4" fill="#7a5f33"/>
    <circle cx="352" cy="372" r="9" fill="#0f141c" stroke="#39414f" stroke-width="3"/>
    <circle cx="424" cy="372" r="9" fill="#0f141c" stroke="#39414f" stroke-width="3"/>
  </g>

  <!-- 蓝色小箱 -->
  <g>
    <rect x="486" y="272" width="98" height="114" rx="10" fill="url(#caseBlue)"/>
    <rect x="500" y="286" width="70" height="7" rx="3.5" fill="#4d7aa8" opacity=".7"/>
    <rect x="522" y="252" width="24" height="24" rx="7" fill="none" stroke="#4d7aa8" stroke-width="5"/>
    <circle cx="500" cy="374" r="8" fill="#0f141c" stroke="#2c4a68" stroke-width="3"/>
    <circle cx="570" cy="374" r="8" fill="#0f141c" stroke="#2c4a68" stroke-width="3"/>
  </g>

  <!-- 红色小箱 -->
  <g>
    <rect x="628" y="300" width="84" height="86" rx="9" fill="url(#caseRed)"/>
    <rect x="640" y="312" width="58" height="6" rx="3" fill="#a95a66" opacity=".7"/>
    <rect x="656" y="282" width="22" height="22" rx="6" fill="none" stroke="#a95a66" stroke-width="5"/>
  </g>

  <!-- 暖光与暗角 -->
  <rect width="900" height="600" fill="url(#bwarm)"/>
  <rect width="900" height="600" fill="url(#bvig)"/>
</svg>
