<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="awall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142134"/>
      <stop offset="1" stop-color="#0a0f17"/>
    </linearGradient>
    <linearGradient id="anight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08101c"/>
      <stop offset="1" stop-color="#0d1a2a"/>
    </linearGradient>
    <linearGradient id="afloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2b3e"/>
      <stop offset="1" stop-color="#0b1219"/>
    </linearGradient>
    <linearGradient id="aglass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a7398" stop-opacity=".30"/>
      <stop offset=".5" stop-color="#2a425c" stop-opacity=".16"/>
      <stop offset="1" stop-color="#5c88ad" stop-opacity=".26"/>
    </linearGradient>
    <radialGradient id="alamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f0b429" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="awarm" cx=".5" cy=".28" r=".62">
      <stop offset="0" stop-color="#f7c548" stop-opacity=".15"/>
      <stop offset="1" stop-color="#f7c548" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="avig" cx=".5" cy=".45" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
  </defs>

  <rect width="900" height="600" fill="url(#awall)"/>
  <rect width="900" height="88" fill="#0c141f"/>

  <!-- 顶灯 -->
  <ellipse cx="180" cy="48" rx="140" ry="46" fill="url(#alamp)"/>
  <ellipse cx="440" cy="48" rx="150" ry="48" fill="url(#alamp)"/>
  <ellipse cx="700" cy="48" rx="140" ry="46" fill="url(#alamp)"/>
  <rect x="120" y="44" width="110" height="9" rx="4.5" fill="#f0b429" opacity=".9"/>
  <rect x="380" y="44" width="110" height="9" rx="4.5" fill="#f0b429" opacity=".9"/>
  <rect x="640" y="44" width="110" height="9" rx="4.5" fill="#f0b429" opacity=".9"/>

  <!-- 玻璃门与夜色 -->
  <rect x="46" y="120" width="360" height="392" rx="8" fill="url(#anight)"/>
  <rect x="46" y="120" width="360" height="392" rx="8" fill="url(#aglass)"/>
  <g fill="#f0b429" opacity=".5">
    <circle cx="120" cy="300" r="3.5"/>
    <circle cx="168" cy="268" r="3"/>
    <circle cx="226" cy="312" r="3.5"/>
    <circle cx="286" cy="282" r="3"/>
    <circle cx="340" cy="318" r="3.5"/>
    <circle cx="150" cy="360" r="2.6"/>
    <circle cx="252" cy="372" r="2.6"/>
    <circle cx="322" cy="352" r="2.6"/>
  </g>
  <g stroke="#38607f" stroke-width="2" opacity=".55">
    <line x1="46" y1="240" x2="406" y2="240"/>
    <line x1="150" y1="120" x2="150" y2="512"/>
    <line x1="302" y1="120" x2="302" y2="512"/>
  </g>
  <rect x="46" y="120" width="360" height="392" rx="8" fill="none" stroke="#3a5877" stroke-width="3" opacity=".8"/>
  <g opacity=".12" fill="#ffffff">
    <polygon points="70,120 100,120 40,512 12,512"/>
    <polygon points="196,120 210,120 152,512 138,512"/>
  </g>

  <!-- 接机人群 -->
  <g>
    <!-- 远处的人 -->
    <g opacity=".55">
      <circle cx="540" cy="318" r="22" fill="#c99a72"/>
      <path d="M508 420 L512 360 Q518 340 540 340 Q562 340 568 360 L572 420 Z" fill="#28455f"/>
      <rect x="500" y="270" width="86" height="54" rx="5" fill="#dfe7f0" opacity=".9"/>
      <rect x="512" y="284" width="62" height="6" rx="3" fill="#7d8ea3"/>
      <rect x="512" y="298" width="44" height="6" rx="3" fill="#9aa9ba"/>
    </g>
    <g opacity=".7">
      <circle cx="680" cy="306" r="24" fill="#d9ab80"/>
      <path d="M646 420 L650 352 Q656 330 680 330 Q704 330 710 352 L714 420 Z" fill="#31536f"/>
      <rect x="636" y="256" width="92" height="56" rx="5" fill="#eef2f7" opacity=".92"/>
      <rect x="648" y="270" width="66" height="6" rx="3" fill="#7d8ea3"/>
      <rect x="648" y="284" width="48" height="6" rx="3" fill="#9aa9ba"/>
    </g>
    <!-- 最近的人 -->
    <g>
      <circle cx="800" cy="292" r="28" fill="#e0b48a"/>
      <path d="M762 430 L766 344 Q772 320 800 320 Q828 320 834 344 L838 430 Z" fill="#2b4a66"/>
      <path d="M786 326 L800 350 L814 326 L806 320 L800 332 L794 320 Z" fill="#dfe7f0" opacity=".85"/>
      <rect x="752" y="238" width="104" height="62" rx="6" fill="#f4f6f9" opacity=".95"/>
      <rect x="766" y="254" width="76" height="7" rx="3.5" fill="#8494a8"/>
      <rect x="766" y="270" width="54" height="7" rx="3.5" fill="#a3b0c0"/>
      <!-- 举牌的手臂 -->
      <path d="M770 360 Q752 330 760 300 L786 306 Q778 336 792 356 Z" fill="#2b4a66"/>
      <path d="M830 360 Q848 330 840 300 L814 306 Q822 336 808 356 Z" fill="#2b4a66"/>
    </g>
  </g>

  <!-- 地面 -->
  <rect x="0" y="512" width="900" height="88" fill="url(#afloor)"/>
  <rect x="0" y="512" width="900" height="3" fill="#f0b429" opacity=".2"/>
  <g opacity=".14" fill="#f0b429">
    <polygon points="120,512 180,512 150,600 60,600"/>
    <polygon points="420,512 470,512 440,600 370,600"/>
    <polygon points="700,512 760,512 730,600 640,600"/>
  </g>

  <rect width="900" height="600" fill="url(#awarm)"/>
  <rect width="900" height="600" fill="url(#avig)"/>
</svg>
