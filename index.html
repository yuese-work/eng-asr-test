<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英语语音测试 v2</title>
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 16px 48px;
    font: 17px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #10131a; color: #e9edf5;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 21px; margin: 0 0 6px; }
  h2 { font-size: 17px; margin: 0 0 8px; color: #9db4e0; }
  .hint { color: #98a2b6; font-size: 14px; margin: 0 0 18px; }
  section {
    background: #171c26; border: 1px solid #232a38; border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
  }
  p { margin: 0 0 10px; font-size: 15px; color: #c2ccdd; }
  b { color: #ffd479; }
  button {
    display: block; width: 100%; padding: 15px 14px; margin: 0 0 10px;
    font-size: 16px; font-family: inherit; font-weight: 600;
    color: #0d1117; background: #6fb1ff; border: 0; border-radius: 10px;
    text-align: left;
  }
  button:disabled { background: #3a465c; color: #8b97ab; }
  button.sec { background: #2b3446; color: #cfd9ea; text-align: center; }
  button.done { background: #4ec97f; }
  pre {
    margin: 0; padding: 10px; border-radius: 8px; background: #0d1117;
    border: 1px solid #1e2532; color: #a9e6a0; font-size: 13px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, monospace;
    min-height: 20px;
  }
</style>
</head>
<body>

<h1>英语语音测试 v2</h1>
<p class="hint">上一版在 iPhone 上抓到了正确的中间结果（置信度 0.98），但会话中途报 aborted。这一版专门找出哪一组配置能跑完整。</p>

<section>
  <h2>怎么测</h2>
  <p>下面 4 个按钮，<b>每个点一次</b>。每次点完等大约 1 秒，再说同一句话：</p>
  <p><b>I would like a large coffee, please.</b></p>
  <p>说完就停，别再操作，让它自己结束（最多 12 秒）。某组报错也没关系，接着试下一组。</p>
</section>

<section>
  <h2>配置测试</h2>
  <button data-cfg="A">A · 不连续 + 要中间结果　（复现上一版）</button>
  <button data-cfg="B">B · 连续 + 要中间结果</button>
  <button data-cfg="C">C · 不连续 + 只要最终结果</button>
  <button data-cfg="D">D · 连续 + 只要最终结果</button>
  <button id="stopBtn" class="sec">手动停止当前识别</button>
  <pre id="log">等待测试…</pre>
</section>

<section>
  <h2>报告</h2>
  <p>四组都试完后，点下面的按钮复制，发我。</p>
  <button id="copyBtn" class="sec">复制报告</button>
  <pre id="report">—</pre>
</section>

<script>
'use strict';

const R = { env: {}, runs: {}, errors: [] };
const $ = (id) => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

const CONFIGS = {
  A: { continuous: false, interimResults: true,  label: '不连续+中间结果' },
  B: { continuous: true,  interimResults: true,  label: '连续+中间结果' },
  C: { continuous: false, interimResults: false, label: '不连续+只最终' },
  D: { continuous: true,  interimResults: false, label: '连续+只最终' }
};

const ua = navigator.userAgent;
R.env = {
  浏览器: ua,
  安全上下文: String(window.isSecureContext),
  微信内置: /MicroMessenger/i.test(ua) ? '是' : '否',
  语音识别API: SR ? '有' : '没有',
  iOS版本: (ua.match(/OS (\d+)[._](\d+)/) || []).slice(1).join('.') || '未知'
};

let active = null;
let capTimer = null;

function log(text) { $('log').textContent = text; }

function finish(cfg, run, reason) {
  if (run.done) return;
  run.done = true;
  run.reason = reason;
  run.ms = Math.round(performance.now() - run.t0);
  clearTimeout(capTimer);
  active = null;
  const btn = document.querySelector('button[data-cfg="' + cfg + '"]');
  if (btn) { btn.disabled = false; btn.classList.add('done'); }
  R.runs[cfg] = run;
  log('配置 ' + cfg + ' 结束\n' +
      '触发结束的原因：' + reason + '\n' +
      '用时：' + run.ms + 'ms\n' +
      '中间结果：' + (run.interim.join(' / ') || '无') + '\n' +
      '最终结果：' + (run.final.join(' / ') || '无') + '\n' +
      '错误：' + (run.errors.join(', ') || '无'));
}

function runConfig(cfg) {
  if (!SR) { log('这个浏览器没有语音识别接口'); return; }
  if (active) { log('上一组还没结束，等一下再点'); return; }

  const c = CONFIGS[cfg];
  const btn = document.querySelector('button[data-cfg="' + cfg + '"]');
  btn.disabled = true;
  const state = { cfg: cfg, label: c.label, t0: performance.now(), interim: [], final: [], errors: [], done: false, reason: '', ms: 0 };
  active = state;

  let rec;
  try {
    rec = new SR();
  } catch (e) {
    state.errors.push('构造异常:' + e.message);
    finish(cfg, state, '构造失败');
    return;
  }
  state.rec = rec;

  rec.lang = 'en-US';
  rec.continuous = c.continuous;
  rec.interimResults = c.interimResults;
  rec.maxAlternatives = 1;

  rec.onstart = () => { log('🎤 配置 ' + cfg + '：开始识别，请说：I would like a large coffee, please.'); };
  rec.onspeechstart = () => { log('听到声音了，继续说…'); };
  rec.onspeechend = () => { log('检测到你停下了，等结果…'); };
  rec.onaudiostart = () => { state.audioStart = Math.round(performance.now() - state.t0); };
  rec.onsoundstart = () => { state.soundStart = Math.round(performance.now() - state.t0); };

  rec.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      const text = r[0].transcript.trim();
      const conf = r[0].confidence ? r[0].confidence.toFixed(2) : '无';
      if (r.isFinal) { state.final.push(text + '(置信度 ' + conf + ')'); }
      else { state.interim.push(text + '(置信度 ' + conf + ')'); }
    }
    log('配置 ' + cfg + ' 进行中…\n中间：' + (state.interim.slice(-1)[0] || '无'));
  };

  rec.onerror = (e) => {
    state.errors.push(e.error);
    R.errors.push(cfg + ':' + e.error);
  };

  rec.onend = () => { finish(cfg, state, 'onend（引擎自己结束）'); };

  capTimer = setTimeout(() => {
    if (active === state && !state.done) {
      try { rec.stop(); } catch (err) { finish(cfg, state, 'auto-stop 且 stop() 抛错:' + err.name); }
    }
  }, 12000);

  try {
    rec.start();
  } catch (e) {
    state.errors.push('start异常:' + e.name);
    finish(cfg, state, 'start() 抛错');
  }
}

document.querySelectorAll('button[data-cfg]').forEach((b) => {
  b.onclick = () => runConfig(b.dataset.cfg);
});

$('stopBtn').onclick = () => {
  if (!active) { log('当前没有在识别'); return; }
  const r = active;
  try { r.rec.stop(); } catch (e) { finish(r.cfg, r, '手动停止抛错:' + e.name); }
  log('已请求手动停止…');
};

function buildReport() {
  const lines = ['=== 英语语音测试 v2 报告 ===', '', '[环境]'];
  for (const [k, v] of Object.entries(R.env)) lines.push(k + '：' + v);
  lines.push('', '[四组配置结果]');
  ['A', 'B', 'C', 'D'].forEach((cfg) => {
    const r = R.runs[cfg];
    if (!r) { lines.push(cfg + '（' + CONFIGS[cfg].label + '）：未测'); return; }
    lines.push(cfg + '（' + r.label + '）');
    lines.push('  结束原因：' + r.reason + '　用时：' + r.ms + 'ms' +
      (r.audioStart !== undefined ? '　音频开始：' + r.audioStart + 'ms' : '') +
      (r.soundStart !== undefined ? '　检测到说话：' + r.soundStart + 'ms' : ''));
    lines.push('  中间结果：' + (r.interim.join(' / ') || '无'));
    lines.push('  最终结果：' + (r.final.join(' / ') || '无'));
    lines.push('  错误：' + (r.errors.join(', ') || '无'));
  });
  return lines.join('\n');
}
function refresh() { $('report').textContent = buildReport(); }
setInterval(refresh, 1000);

$('copyBtn').onclick = async () => {
  const txt = buildReport();
  try {
    await navigator.clipboard.writeText(txt);
    $('copyBtn').textContent = '✅ 已复制，去微信粘贴发我';
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); $('copyBtn').textContent = '✅ 已复制（备用方式）'; }
    catch (e2) { $('copyBtn').textContent = '复制失败，请长按上面文字手动选中'; }
    document.body.removeChild(ta);
  }
  setTimeout(() => { $('copyBtn').textContent = '复制报告'; }, 4000);
};

refresh();
</script>
</body>
</html>
